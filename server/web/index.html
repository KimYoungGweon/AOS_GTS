<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTS — AOS Gas Training System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23E39A3B'/%3E%3Ctext x='16' y='21' font-family='monospace' font-size='11' font-weight='700' text-anchor='middle' fill='%2316110A'%3EGTS%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="brand" href="#/overview" aria-label="동작 상황표로">
      <span class="logo">GTS</span>
      <span class="name" style="color:var(--tx)">AOS Gas Training System</span>
    </a>
    <nav class="nav" id="nav">
      <a href="#/overview" data-r="overview">동작 상황표</a>
      <a href="#/detail" data-r="detail">장비 상세</a>
      <a href="#/viewer" data-r="viewer">Heatmap Viewer</a>
      <a href="#/data" data-r="data">데이터 목록</a>
    </nav>
    <div class="topright">
      <div class="pill bad" id="connPill"><span class="dot err" id="connDot"></span><span id="connText">연결 중…</span><span class="sub" id="connSub"></span></div>
      <div class="clock" id="clock"></div>
      <div class="who"><span id="whoText"></span><button class="btn sm ghost" id="logoutBtn" type="button">로그아웃</button></div>
    </div>
  </header>
  <main id="view" style="display:flex;flex-direction:column;flex:1 1 auto;min-height:0"></main>
</div>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
